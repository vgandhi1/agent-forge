[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.2.3"
description = "Multi-agent intake, design, implementation, QA, and DevOps orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "textual>=0.79.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25.0"]

[project.scripts]
agentforge = "cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = ["core", "agents"]
py-modules = ["cli", "tui_main", "main", "web_ui"]

# Use Astral uv for the virtualenv + locked installs: `uv sync`, then `uv run python main.py …`
# See USAGE.md and https://docs.astral.sh/uv/
[tool.uv]
package = true
