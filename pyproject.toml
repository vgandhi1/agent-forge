[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.3.0"
description = "Multi-agent intake, design, implementation, QA, and DevOps orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "textual>=0.79.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25.0"]
# Contract-revision POC (contracts/): binary-doc + flattened-PDF retitle tools.
contracts = [
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",  # OCR readback of raster titles; needs the `tesseract` binary on PATH
]

[project.scripts]
agentforge = "cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that call a real LLM provider (opt-in; require AGENTFORGE_RUN_LIVE=1 and an API key)",
]
# Committed fixture repos under tests/fixtures/ contain their own test_*.py used by
# integration tests (run via a separate pytest subprocess); don't collect them here.
norecursedirs = ["fixtures", "*.egg", ".*", "build", "dist"]

[tool.setuptools]
packages = ["core", "agents"]
py-modules = ["cli", "tui_main", "main", "web_ui"]

# Use Astral uv for the virtualenv + locked installs: `uv sync`, then `uv run python main.py …`
# See docs/USAGE.md and https://docs.astral.sh/uv/
[tool.uv]
package = true
